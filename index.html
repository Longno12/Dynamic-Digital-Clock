<!DOCTYPE html>
<html lang="en" data-theme="neon" data-font="poppins">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraClock - A Modern Timepiece</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app-container">
        <div class="background-gradient"></div>

        <main class="main-content">
            <div class="time-display">
                <div id="date-display" class="date-display"></div>
                <div id="digital-clock" class="digital-clock">00:00:00</div>
            </div>

            <div class="analog-clock-wrapper">
                <div class="analog-clock">
                    <div class="hand hour-hand" id="hour-hand"></div>
                    <div class="hand minute-hand" id="minute-hand"></div>
                    <div class="hand second-hand" id="second-hand"></div>
                    <div class="center-dot"></div>
                </div>
            </div>

            <div class="widget-bar">
                <div class="widget weather-widget" id="weather-widget">
                    <i class="fas fa-map-marker-alt"></i>
                    <span id="location-name">Loading...</span>
                    <span id="temperature"></span>
                </div>
                <div class="widget alarm-widget" id="alarm-widget">
                    <i class="fas fa-bell"></i>
                    <span id="alarm-status">No Alarm Set</span>
                </div>
            </div>
        </main>

        <button id="settings-toggle" class="settings-toggle-btn">
            <i class="fas fa-cog fa-spin"></i>
        </button>

        <aside id="settings-panel" class="settings-panel">
            <div class="settings-header">
                <h3>Settings</h3>
                <button id="settings-close-btn" class="close-btn">×</button>
            </div>
            <div class="settings-content">
                <div class="setting-item">
                    <label for="theme-selector">Theme</label>
                    <select id="theme-selector">
                        <option value="neon">Neon</option>
                        <option value="ocean">Ocean</option>
                        <option value="sunrise">Sunrise</option>
                        <option value="forest">Forest</option>
                        <option value="mono-light">Mono Light</option>
                        <option value="mono-dark">Mono Dark</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label for="font-selector">Font</label>
                    <select id="font-selector">
                        <option value="poppins">Poppins</option>
                        <option value="roboto">Roboto</option>
                        <option value="nunito">Nunito</option>
                        <option value="system-ui">System UI</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>Time Format</label>
                    <button id="toggle-format-btn" class="setting-button">Switch to 12-Hour</button>
                </div>
                <div class="setting-item">
                    <label for="alarm-time-input">Set Alarm</label>
                    <div class="alarm-input-group">
                        <input type="time" id="alarm-time-input">
                        <button id="set-alarm-btn" class="setting-button">Set</button>
                    </div>
                </div>
                <div class="setting-item world-clocks-setting">
                    <label>World Clocks</label>
                    <div id="world-clocks-container">
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Roboto:wght@300;400;500&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="script.js"></script>
</body>
</html>
